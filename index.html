<body>

    <!-- ambient glows, nav, hero, products, etc. -->

    <!-- Modal -->
    <div class="modal-overlay" id="buyModal" onclick="closeBuyModal(event)">
        <div class="modal-box">
            <h3>Awesome taste!</h3>
            <p id="modalText">Wait a little, our servers are loading...</p>
            <button onclick="document.getElementById('buyModal').classList.remove('active')">Close</button>
        </div>
    </div>

    <script>
        function openBuyModal(deviceName) {
            const modal = document.getElementById('buyModal');
            const text = document.getElementById('modalText');
            text.textContent = "Loading listing & photos for " + deviceName + "... Wait a little, our servers are loading...";
            modal.classList.add('active');
        }

        function closeBuyModal(e) {
            if (e.target.id === 'buyModal') {
                document.getElementById('buyModal').classList.remove('active');
            }
        }
    </script>
</body>
</html>
